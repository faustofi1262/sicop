{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>
            <h3 class="mb-1">
                ✏ Editar Orden de Catálogo
            </h3>

            <p class="text-muted mb-0">
                Modifique los datos de la orden seleccionada.
            </p>
        </div>

        <a href="{{ url_for(
            'main.orden_catalogo_nueva',
            tarea_id=orden.tarea_id
        ) }}"
        class="btn btn-secondary">

            ⬅ Volver al catálogo

        </a>

    </div>


    <div class="card mb-4">

        <div class="card-header bg-dark text-white">
            Datos del proceso
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Código del proceso</label>

                    <input type="text"
                           class="form-control"
                           value="{{ orden.codigo_proceso }}"
                           readonly>
                </div>


                <div class="col-md-4 mb-3">
                    <label>Unidad requirente</label>

                    <input type="text"
                           class="form-control"
                           value="{{ orden.unidad_requirente }}"
                           readonly>
                </div>


                <div class="col-md-4 mb-3">
                    <label>Presupuesto referencial</label>

                    <input type="text"
                           class="form-control"
                           value="$ {{ '{:,.2f}'.format(
                               orden.presupuesto_referencial or 0
                           ) }}"
                           readonly>
                </div>


                <div class="col-md-12 mb-3">
                    <label>Objeto de contratación</label>

                    <textarea class="form-control"
                              rows="3"
                              readonly>{{ orden.objeto_contratacion }}</textarea>
                </div>

            </div>

        </div>

    </div>


    <form method="POST">

        <div class="card mb-4">

            <div class="card-header bg-warning">
                Datos de la orden
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label>Número de orden</label>

                        <input type="text"
                               name="numero_orden"
                               class="form-control"
                               value="{{ orden.numero_orden or '' }}"
                               required>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label>Fecha de aceptación</label>

                        <input type="date"
                               name="fecha_aceptacion"
                               id="fecha_aceptacion"
                               class="form-control"
                               value="{{ orden.fecha_aceptacion.strftime('%Y-%m-%d')
                                        if orden.fecha_aceptacion else '' }}"
                               required>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label>Plazo en días</label>

                        <input type="number"
                               name="plazo_dias"
                               id="plazo_dias"
                               class="form-control"
                               value="{{ orden.plazo_dias or 0 }}"
                               min="0"
                               required>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label>Fecha de vencimiento</label>

                        <input type="date"
                               id="fecha_vencimiento"
                               class="form-control"
                               value="{{ orden.fecha_vencimiento.strftime('%Y-%m-%d')
                                        if orden.fecha_vencimiento else '' }}"
                               readonly>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label>RUC</label>

                        <input type="text"
                               name="ruc"
                               class="form-control"
                               value="{{ orden.ruc or '' }}"
                               required>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label>Proveedor</label>

                        <input type="text"
                               name="proveedor"
                               class="form-control"
                               value="{{ orden.proveedor or '' }}"
                               required>
                    </div>


                    <div class="col-md-4 mb-3">
                        <label>Monto adjudicado</label>

                        <input type="number"
                               name="monto_adjudicado"
                               class="form-control"
                               value="{{ orden.monto_adjudicado or 0 }}"
                               step="0.01"
                               min="0"
                               required>
                    </div>


                    <div class="col-md-8 mb-3">
                        <label>Administrador de la orden</label>

                        <input type="text"
                               name="administrador_orden"
                               class="form-control"
                               value="{{ orden.administrador_orden or '' }}"
                               required>
                    </div>


                    <div class="col-md-12 mb-3">
                        <label>Observaciones</label>

                        <textarea name="observaciones"
                                  class="form-control"
                                  rows="3">{{ orden.observaciones or '' }}</textarea>
                    </div>

                </div>

            </div>

        </div>


        <div class="d-flex justify-content-end">

            <button type="submit"
                    class="btn btn-success btn-lg">

                💾 Guardar cambios

            </button>

        </div>

    </form>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const fechaAceptacion =
        document.getElementById("fecha_aceptacion");

    const plazoDias =
        document.getElementById("plazo_dias");

    const fechaVencimiento =
        document.getElementById("fecha_vencimiento");


    function calcularFechaVencimiento() {

        if (!fechaAceptacion.value || !plazoDias.value) {
            fechaVencimiento.value = "";
            return;
        }

        const fecha =
            new Date(
                fechaAceptacion.value + "T00:00:00"
            );

        fecha.setDate(
            fecha.getDate() +
            parseInt(plazoDias.value || 0)
        );

        const anio = fecha.getFullYear();

        const mes = String(
            fecha.getMonth() + 1
        ).padStart(2, "0");

        const dia = String(
            fecha.getDate()
        ).padStart(2, "0");

        fechaVencimiento.value =
            `${anio}-${mes}-${dia}`;
    }


    fechaAceptacion.addEventListener(
        "change",
        calcularFechaVencimiento
    );

    plazoDias.addEventListener(
        "input",
        calcularFechaVencimiento
    );

});
</script>

{% endblock %}
