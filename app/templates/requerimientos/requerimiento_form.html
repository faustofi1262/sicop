<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Requerimiento - SICOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sicop.css') }}">
    <style>
        body { background:#f3f6fa; }
        .requerimiento-page { max-width:1280px; margin:34px auto; padding:0 18px; }
        .requerimiento-card { border:0; border-radius:16px; overflow:hidden; box-shadow:0 12px 32px rgba(15,47,79,.10); background:#fff; }
        .requerimiento-header { background:linear-gradient(135deg,#0b2f4f,#174f7c); color:#fff; padding:24px 28px; }
        .requerimiento-header h3 { margin:0; font-weight:700; }
        .requerimiento-header p { margin:6px 0 0; color:#dbeafe; }
        .form-body { padding:28px; }
        .section-title { color:#0b2f4f; font-size:17px; font-weight:700; border-bottom:2px solid #dbe7f2; padding-bottom:8px; margin-bottom:20px; }
        .form-group label,.field-label { color:#24384c; font-weight:600; margin-bottom:6px; }
        .form-control { border-radius:8px; border-color:#cfd9e3; }
        .form-control:focus { border-color:#3b82f6; box-shadow:0 0 0 .15rem rgba(59,130,246,.12); }
        .readonly-field { background:#eef4f9!important; color:#334155; font-weight:600; }
        .estructura-box { background:#f8fbfe; border:1px solid #dbe7f2; border-left:4px solid #1d70b7; border-radius:12px; padding:18px 18px 4px; margin-bottom:18px; }
        .unidad-resumen { display:none; margin-top:12px; padding:9px 12px; border-radius:8px; background:#eaf4ff; color:#0b4f83; font-size:13px; font-weight:600; }
        .panel-box { background:#fbfcfe; border:1px solid #e1e7ef; border-radius:12px; padding:18px; }
        .btn-guardar { background:#0f7a55; border-color:#0f7a55; font-weight:700; min-width:205px; }
        .btn-guardar:hover { background:#0b6547; border-color:#0b6547; }
        .btn-volver { font-weight:600; min-width:120px; }
        .version-tag { font-size:11px; color:#94a3b8; text-align:right; margin-top:8px; }
        @media (max-width:767px){ .form-body{padding:18px}.requerimiento-header{padding:20px} }
    </style>
</head>
<body>
<div class="requerimiento-page">
    <div class="requerimiento-card">
        <div class="requerimiento-header">
            <h3>📋 Ingreso de Requerimiento</h3>
            <p>Registro institucional y estructura de la unidad requirente</p>
        </div>

        <div class="form-body">
            <form method="POST" action="{{ url_for('main.guardar_requerimiento') }}">

                {% if requerimiento %}
                <input type="hidden" name="id" value="{{ requerimiento.id }}">
                {% endif %}

                <div class="section-title">📝 Datos del requerimiento</div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Memorando Requirente</label>
                        <input type="text" name="mem_requi" class="form-control" value="{{ requerimiento.mem_requi if requerimiento else '' }}">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Fecha Memorando Requirente</label>
                        <input type="date" name="fecha_memo_requi" class="form-control" value="{{ requerimiento.fecha_memo_requi.strftime('%Y-%m-%d') if requerimiento and requerimiento.fecha_memo_requi else '' }}">
                    </div>
                </div>
                <!-- ==========================================================
                FUNCIONARIO ELABORADOR
                ==========================================================
                Identifica al servidor de la unidad requirente que elaboró
                la documentación remitida a Compras Públicas.

                Este campo es diferente del funcionario encargado,
                que corresponde al analista UCP asignado al requerimiento.
                    ========================================================== -->

                    <div class="form-group">

                        <label for="funcionario_elaborador">
                            Funcionario elaborador
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="funcionario_elaborador"
                            name="funcionario_elaborador"
                            value="{{ requerimiento.funcionario_elaborador if requerimiento else '' }}"
                            placeholder="Nombre del servidor que elaboró la documentación"
                        >

                    </div>
                <div class="estructura-box">
                    <div class="row">
                        <div class="col-lg-4 col-md-12 mb-3">
                            <label class="field-label">Unidad Requirente</label>
                            <select name="unid_requirente" id="unid_requirente" class="form-control" required>
                                <option value="">Seleccione una unidad</option>
                                {% for u in unidades %}
                                <option value="{{ u[0] }}"
                                        data-nombre="{{ u[1] or '' }}"
                                        data-departamento="{{ u[2] or '' }}"
                                        data-bloque="{{ u[3] or '' }}"
                                        {% if requerimiento and u[0] == requerimiento.unid_requirente %}selected{% endif %}>
                                    {{ u[4] }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-lg-4 col-md-6 mb-3">
                            <label class="field-label">Departamento Principal</label>
                            <input type="text" id="departamento_principal" class="form-control readonly-field" readonly placeholder="Se completa automáticamente">
                        </div>

                        <div class="col-lg-4 col-md-6 mb-3">
                            <label class="field-label">Bloque</label>
                            <input type="text" id="bloque" class="form-control readonly-field" readonly placeholder="Se completa automáticamente">
                        </div>
                    </div>
                    <div id="unidad_resumen" class="unidad-resumen"></div>
                </div>

                <div class="form-row mb-2">
                    <div class="form-group col-md-6">
                        <label>Funcionario Encargado</label>
                        <select name="funcionario_encargado" class="form-control" required>
                            <option value="">Seleccione funcionario</option>
                            {% for f in funcionarios %}
                            <option value="{{ f[0] }}" {% if requerimiento and f[0] == requerimiento.funcionario_encargado %}selected{% endif %}>{{ f[0] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="section-title mt-3">📑 Memorandos administrativos</div>
                <div class="panel-box mb-4">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Memo Vice Administrativo</label>
                            <input type="text" name="memo_vice_ad" class="form-control" value="{{ requerimiento.memo_vice_ad if requerimiento else '' }}">
                        </div>
                        <div class="form-group col-md-6">
                            <label>Fecha Memo Vice Administrativo</label>
                            <input type="date" name="fecha_memo_vice_ad" class="form-control" value="{{ requerimiento.fecha_memo_vice_ad.strftime('%Y-%m-%d') if requerimiento and requerimiento.fecha_memo_vice_ad else '' }}">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Memo Director Administrativo</label>
                            <input type="text" name="memo_dir_ad" class="form-control" value="{{ requerimiento.memo_dir_ad if requerimiento else '' }}">
                        </div>
                        <div class="form-group col-md-6">
                            <label>Fecha Memo Director Administrativo</label>
                            <input type="date" name="fecha_memo_dir_ad" class="form-control" value="{{ requerimiento.fecha_memo_dir_ad.strftime('%Y-%m-%d') if requerimiento and requerimiento.fecha_memo_dir_ad else '' }}">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>Fecha de Recepción</label>
                            <input type="date" name="fecha_recep_req" class="form-control" value="{{ requerimiento.fecha_recep_req.strftime('%Y-%m-%d') if requerimiento and requerimiento.fecha_recep_req else '' }}">
                        </div>
                        <div class="form-group col-md-4">
                            <label>Monto Requerido</label>
                            <input type="number" step="0.01" name="monto_req" class="form-control" value="{{ requerimiento.monto_req if requerimiento else '' }}">
                        </div>
                    </div>
                </div>

                <div class="section-title">💰 Descripción y presupuesto</div>
                <div class="panel-box">
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>Breve descripción</label>
                            <select name="breve_descr" class="form-control">
                                <option value="">Seleccione</option>
                                {% for v in ['Bien','Servicio','Obra','Consultoría','Seguros'] %}
                                <option value="{{ v }}" {% if requerimiento and requerimiento.breve_descr == v %}selected{% endif %}>{{ v }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group col-md-8">
                            <label>Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="4" placeholder="Describa el objeto del requerimiento">{{ requerimiento.descripcion if requerimiento else '' }}</textarea>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex flex-wrap">
                    <button type="submit" class="btn btn-success btn-guardar mr-2 mb-2">💾 Guardar Requerimiento</button>
                    <a href="{{ url_for('main.listar_requerimientos') }}" class="btn btn-secondary btn-volver mb-2">⬅ Volver</a>
                </div>

                <div class="version-tag">SICOP · Formulario estructurado de unidades</div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const selectUnidad = document.getElementById("unid_requirente");
    const departamento = document.getElementById("departamento_principal");
    const bloque = document.getElementById("bloque");
    const resumen = document.getElementById("unidad_resumen");

    if (!selectUnidad) return;

    function cargarDatosUnidad() {
        const opcion = selectUnidad.options[selectUnidad.selectedIndex];

        if (!opcion || !opcion.value) {
            if (departamento) departamento.value = "";
            if (bloque) bloque.value = "";
            if (resumen) {
                resumen.style.display = "none";
                resumen.textContent = "";
            }
            return;
        }

        const nombre = opcion.dataset.nombre || "";
        const departamentoValor = opcion.dataset.departamento || "";
        const bloqueValor = opcion.dataset.bloque || "";

        if (departamento) departamento.value = departamentoValor;
        if (bloque) bloque.value = bloqueValor;

        if (resumen) {
            let texto = nombre;
            if (bloqueValor) texto += " — " + bloqueValor;
            resumen.textContent = "Estructura seleccionada: " + texto;
            resumen.style.display = "block";
        }
    }

    selectUnidad.addEventListener("change", cargarDatosUnidad);
    cargarDatosUnidad();
});
</script>
</body>
</html>
